name: webrtc_video_call
description: WebRTC video call app with room codes
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.4.1
  socket_io_client: ^3.1.4
  http: ^1.6.0
  uuid: ^4.0.0
  permission_handler: ^11.0.1
  fluttertoast: ^8.2.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true